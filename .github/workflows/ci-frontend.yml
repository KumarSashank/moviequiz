name: CI – Frontend

on:
  push:
    branches:
      - develop
      - staging
      - preprod
      - main
    paths:
      - 'frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Run tests
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      # 5. Build production bundle
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      # 6. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build & Push Docker Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v3
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            kumarsashank/quiz-frontend:${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'preprod' && 'preprod' || github.ref_name == 'main' && 'latest' }}
            kumarsashank/quiz-frontend:latest
