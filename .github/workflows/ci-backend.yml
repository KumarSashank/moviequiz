name: CI – Backend

on:
  push:
    branches:
      - develop
      - staging
      - preprod
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v3

      # 2. Set up JDK 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      # 3. Build & test with Gradle
      - name: Build & Test Spring Boot
        working-directory: backend
        run: ./gradlew clean build

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build & push Docker image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v3
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            subhash24/quiz-backend:${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'preprod' && 'preprod' || github.ref_name == 'main' && 'latest' }}
            subhash24/quiz-backend:latest
