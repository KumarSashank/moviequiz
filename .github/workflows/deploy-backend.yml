name: CD – Deploy Backend to Cloud Run

on:
  push:
    branches:
      - develop
      - staging
      - preprod
      - main

env:
  # Map git branch → image tag suffix exactly as your CI does
  IMAGE_TAG: ${{ github.ref_name == 'develop' && 'dev' ||
    github.ref_name == 'staging' && 'staging' ||
    github.ref_name == 'preprod' && 'preprod' ||
    github.ref_name == 'main' && 'latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # … authenticate to GCP as before …

      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME="quiz-backend-${{ github.ref_name == 'develop' && 'dev' || \
                         github.ref_name == 'staging' && 'staging' || \
                         github.ref_name == 'preprod' && 'preprod' || \
                         'prod' }}"
          echo "Deploying image eonnverse/quiz-backend:${{ env.IMAGE_TAG }} to $SERVICE_NAME"
          gcloud run deploy $SERVICE_NAME \
            --image="docker.io/eonnverse/quiz-backend:${{ env.IMAGE_TAG }}" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars SPRING_PROFILES_ACTIVE=${{ github.ref_name }}
